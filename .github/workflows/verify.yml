name: Verify keyboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
        with: { packages: platform-tools }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm run build:secure
      - run: mobile/android/gradlew -p mobile/android assembleDebug assembleRelease lintDebug --console=plain
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run build:secure
      - run: npm run test:interop
      - run: xcodebuild -project mobile/ios/KMSample2.xcodeproj -target KMSample2 -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
