plugins { id 'com.android.application' }
android {
    namespace 'com.gachlagan.releasehost'
    compileSdk 36
    defaultConfig {
        applicationId 'com.gachlagan.releasehost'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    // Reuse the existing host activity in a separate application so tests can
    // exercise the real signed keyboard without enabling WebView debugging.
    sourceSets.main.java.srcDirs = ['../app/src/debug/java']
}
